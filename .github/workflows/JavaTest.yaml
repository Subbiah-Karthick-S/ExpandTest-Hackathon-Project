name: Run Java Tests
on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: mvn test

      - name: Send HTML Report Mail
        if: always() #used to allow failed test cases to uploaded in github and send report
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true


          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}

          subject: Automation Test Report

          to: subbiahkarthick2004@gmail.com
          from: Github Actions
          html_body: file://reports/report.html

